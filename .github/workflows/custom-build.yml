  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.4'

  - name: Apply app name and version
    env:
      APP_NAME: ${{ github.event.inputs.app_name }}
      APP_VERSION: ${{ github.event.inputs.app_version }}
    run: |
      set -e
      SAFE_NAME="${APP_NAME:-Wallpaper}"
      SAFE_VERSION="${APP_VERSION:-1.0.0}"
      echo "Building app: $SAFE_NAME v$SAFE_VERSION"
      sed -i "0,/android:label=\"[^\"]*\"/s//android:label=\"$SAFE_NAME\"/" app/src/main/AndroidManifest.xml
      sed -i "s/versionName = \"[^\"]*\"/versionName = \"$SAFE_VERSION\"/" app/build.gradle.kts

  - name: Apply custom app icon (optional)
    continue-on-error: true
    run: |
      set +e
      ICON_SRC=""
      if [ -f "build-icon.png" ]; then
        ICON_SRC="build-icon.png"
        echo "Using custom icon from build-icon.png"
      elif [ -f "app/src/main/res/drawable/ic_launcher.png" ]; then
        ICON_SRC="app/src/main/res/drawable/ic_launcher.png"
        echo "No custom icon provided, using default project icon"
      fi
      if [ -n "$ICON_SRC" ]; then
        for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
          mkdir -p "app/src/main/res/mipmap-$density"
          cp "$ICON_SRC" "app/src/main/res/mipmap-$density/ic_launcher.png"
          cp "$ICON_SRC" "app/src/main/res/mipmap-$density/ic_launcher_round.png"
        done
      else
        echo "No icon source found, skipping icon setup"
      fi
      exit 0

  - name: Build debug APK
    run: gradle assembleDebug --stacktrace --no-daemon

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: Android-APK
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error